steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/enigmacero/enigmacero:$SHORT_SHA", "."]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:548.0.0
    entrypoint: bash
    args:
      - -lc
      - |
        gcloud run deploy enigmacero \
          --image "us-central1-docker.pkg.dev/$PROJECT_ID/enigmacero/enigmacero:$SHORT_SHA" \
          --region us-central1 \
          --allow-unauthenticated
images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/enigmacero/enigmacero:$SHORT_SHA"
